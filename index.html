<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Recipe Predictor</title>
  <link rel="stylesheet" href="./style.css">
  <!-- ONNX Runtime Web CDN -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
</head>
<body>

  <div class="container">
    <h1>AI Recipe Predictor</h1>
    <div id="status" class="status">loading ipa dictionary</div>

    <div class="input-group">
      <input type="text" id="ingInput" placeholder="ex: salmon, salt, garlic" disabled />
      <button id="addBtn" class="btn-add" disabled>adding</button>
    </div>

    <div id="ingredientChips" class="chips"></div>

    <button id="predictBtn" class="btn-predict" disabled>predict</button>

    <div class="results" id="resultContainer" style="display: none;">
      <h3>results</h3>
      <div id="resultList"></div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
